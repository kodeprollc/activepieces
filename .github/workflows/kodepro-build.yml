name: Build and deploy KodePro image

on:
  push:
    branches:
      - kodepro-patches

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kodeprollc/activepieces

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Get commit SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.sha }}

      - name: Deploy to all workflow services
        uses: appleboy/ssh-action@v1.0.3
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          NEW_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: kode
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: COOLIFY_API_TOKEN,NEW_IMAGE
          script: |
            set -euo pipefail

            # Pull new image while services are still running
            docker pull "$NEW_IMAGE"
            echo "Image pulled: $NEW_IMAGE"

            # Get all workflow service UUIDs from Coolify
            SERVICES=$(curl -sf \
              -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              https://coolify.kodepro.com/api/v1/services | \
              python3 -c "
            import sys, json
            data = json.load(sys.stdin)
            items = data if isinstance(data, list) else data.get('data', [])
            for s in items:
                if 'workflows' in s.get('name', '').lower():
                    print(s['uuid'] + '|' + s['name'])
            ")

            for entry in $SERVICES; do
              UUID="${entry%%|*}"
              NAME="${entry##*|}"
              SLUG="${NAME%-workflows}"
              CONTAINER="${SLUG}-activepieces-${UUID}"
              echo "[$NAME] Deploying $NEW_IMAGE"

              # Update compose SHA in Coolify (for dashboard consistency)
              UPDATED=$(curl -sf \
                -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
                "https://coolify.kodepro.com/api/v1/services/$UUID" | \
                python3 -c "
            import sys, json, base64, re
            d = json.load(sys.stdin)
            compose = d['docker_compose_raw']
            updated = re.sub(r'ghcr\.io/kodeprollc/activepieces:[a-f0-9]+', '$NEW_IMAGE', compose)
            print(base64.b64encode(updated.encode()).decode())
            ")

              curl -sf -X PATCH \
                -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"docker_compose_raw\": \"$UPDATED\"}" \
                "https://coolify.kodepro.com/api/v1/services/$UUID" > /dev/null

              # Stop old container if running
              if docker inspect "$CONTAINER" > /dev/null 2>&1; then
                echo "  Stopping $CONTAINER"
                docker stop "$CONTAINER"
                docker rm "$CONTAINER"
              fi

              # Bring service back up via Coolify start (image already on disk, instant)
              curl -s -X POST \
                -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
                "https://coolify.kodepro.com/api/v1/services/$UUID/start" > /dev/null

              # Poll until healthy or timeout (120s)
              echo -n "  Waiting for $CONTAINER to be healthy"
              ELAPSED=0
              HEALTHY=false
              while [ $ELAPSED -lt 120 ]; do
                STATUS=$(docker inspect "$CONTAINER" --format '{{.State.Health.Status}}' 2>/dev/null || echo "missing")
                if [ "$STATUS" = "healthy" ]; then
                  HEALTHY=true
                  break
                fi
                echo -n "."
                sleep 5
                ELAPSED=$((ELAPSED + 5))
              done

              if $HEALTHY; then
                echo " ✓"
              else
                echo " TIMEOUT — attempting second start"
                curl -s -X POST \
                  -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
                  "https://coolify.kodepro.com/api/v1/services/$UUID/start" > /dev/null
                sleep 30
                STATUS=$(docker inspect "$CONTAINER" --format '{{.State.Health.Status}}' 2>/dev/null || echo "missing")
                echo "  Final status: $STATUS"
              fi
            done

            echo "All workflow services updated."
